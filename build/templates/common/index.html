<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" style="height: 100%; width: 100%;" lang="en">

<head>
    <title>{{title}}</title>
    <meta charset="utf-8">
    <meta name="description" property="og:description"
        content="The JavaScript Bold Report Viewer allows the end-users to visualize the {{sampleName}} report in browsers.">
    <meta property="og:image" content="https://demos.boldreports.com/Images/og_embedded_javascript_examples.png" alt="Reports sample for React" />
    <meta property="og:image:secure_url" content="https://demos.boldreports.com/Images/og_embedded_javascript_examples.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:title" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script>
        function validateBrowser() {
            var uaValidate = navigator.userAgent.match(/(MSIE |Trident.*rv[ :])([0-9]+)/);
            if (uaValidate != null)
                return uaValidate[2];
            return null;
        }
        var ieVer = validateBrowser();
        if (ieVer != null && ieVer < 11) {
            if (!location.origin) {
                location.origin = window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port : '');
                location.href = location.origin + '/error.html';
            }
        }
        (function addTrailingSlash() {
            var path = window.location.pathname;
            if (path.indexOf('/preview') !== -1 && !path.endsWith('/')) {
                var newUrl = window.location.origin + path + '/';
                window.location.replace(newUrl);
            }
        })();
    </script>
    <link rel="shortcut icon" type="image/x-icon" href="../../../favicon.ico">
    <link href="../../../common/index.css" rel="stylesheet" />
</head>

<body>
    <div hidden id="reports-analytics" data-queue="Bold Reports - Demos - JavaScript"></div>
    <style>
        /* Report Viewer */
        .e-reportviewer .e-reportviewer-toolbarcontainer .e-reportviewer-toolbarul.e-show {
            border-style: none;
            float: right;
        }

        .e-reportviewer-toolbarcontainer.e-toolbar {
            padding-right: 0px;
        }

        .e-reportviewer-icon.ej-webicon {
            font-family: 'ej-webfont';
        }

        #description {
            display: none;
        }
    </style>
    <div class="splash">
        <div class="message">JavaScript Reports</div>
        <div class="loader">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
    </div>
    <div class="ej-body e-hidden">
        <div class="ej-sb-header">
            <div class="ej-sb-left-side">
                <a href="https://www.boldreports.com/" class="ej-sb-logo-link" title="Bold Reports Home">
                    <img class="ej-sb-logo" src="https://cdn.boldreports.com/website/images/logo/bold-reports-logo.svg" alt="Bold Reports Logo" />
                </a>
                <div class="ej-framework-selector">
                    <h1 class="ej-fw-label">Frameworks</h1>
                    <div class="ej-fw-pills">
                        <a data-fw-slug="" class="ej-fw-pill">ASP.NET Core</a>
                        <a data-fw-slug="blazor" class="ej-fw-pill">Blazor</a>
                        <a data-fw-slug="angular" class="ej-fw-pill">Angular</a>
                        <a data-fw-slug="react" class="ej-fw-pill">React</a>
                        <span class="ej-fw-pill active" aria-current="page">JavaScript</span>
                    </div>
                </div>
            </div>
            <div class="ej-sb-right-side">
                <a class="ej-sb-button nav-link request-demo" href="https://www.boldreports.com/embedded-reporting/javascript-report-viewer" target="_blank">Product Details</a>
                <a class="ej-sb-button nav-link try-it-free" href="https://www.boldreports.com/register/reports?evaluation=v2" target="_blank">Try it Free</a>
            </div>
        </div>
        <div class="ej-preview-content">
            {{body}}
        </div>
    </div>
    <script src="../../../common/reports.js"></script>
    <script src="./index.js"></script>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelector(".splash").classList.add('e-hidden');
        document.querySelector('.ej-body.e-hidden').classList.remove('e-hidden');
        setReportsHeight();
    });

    window.addEventListener('resize', () => {
        setReportsHeight();
    });

    if (location.href.includes('external-parameter-report')) {
        var userAgent = window.navigator.userAgent;
        var isMobile = /mobile/i.test(userAgent);
        var wheelEvent = 'onwheel' in document.createElement('div') ? 'wheel' : 'mousewheel';
        if (wheelEvent && !isMobile) {
            window.addEventListener(wheelEvent, function () { }, { passive: false });
        }
    }

    function setReportsHeight() {
        if (isExternalParameter()) {
            let style = document.getElementById('reports-style');
            if (!style) {
                style = document.createElement('style');
                style.id = 'reports-style';
                document.body.appendChild(style);
            }
            style.textContent = `ej-sample{
                display:block;
                overflow: hidden;
                height: ${window.innerHeight -
                (document.getElementsByClassName('ej-preview-content')[0].getBoundingClientRect().top - document.body.getBoundingClientRect().top)}px
                }`;
        }

    }
    function isExternalParameter() {
        const externalParameterSamples = [
            '/external-parameter-report',
            '/multi-language-report'
        ];
        return externalParameterSamples.some(path => location.href.includes(path)) && location.href.includes('/preview');
    }
</script>

</html>
